<style>

  --shadow:0 1px 2px rgba(0,60,30,.06),0 4px 14px rgba(0,60,30,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1712;--card:#18231c;--ink:#e8f1ea;--muted:#9bb0a2;--line:#2a3a30;--soft:#141e18;
  --x:#3dbb7a;--la:#6cc04a;--xn:#1c3226;--vang:#e0b04a;--vn:#33290f;--do:#ec7a6c;--dn:#3a2220;
  --lam:#79a6e6;--ln:#1f2a3c;--tim:#b394e0;--tn:#2a2238;--cam:#f0995c;--cn:#3a2618;--hong:#ec87b1;--hn:#3a1f2b;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0f1712;--card:#18231c;--ink:#e8f1ea;--muted:#9bb0a2;--line:#2a3a30;--soft:#141e18;
  --x:#3dbb7a;--la:#6cc04a;--xn:#1c3226;--vang:#e0b04a;--vn:#33290f;--do:#ec7a6c;--dn:#3a2220;
  --lam:#79a6e6;--ln:#1f2a3c;--tim:#b394e0;--tn:#2a2238;--cam:#f0995c;--cn:#3a2618;--hong:#ec87b1;--hn:#3a1f2b;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--x)}
.an{display:none!important}
.top{background:linear-gradient(120deg,#005a34,#007a45 60%,#5aa52c);color:#fff;padding:12px 16px 14px;padding-top:max(12px,env(safe-area-inset-top))}
.top .h1{display:flex;align-items:center;gap:8px;max-width:1180px;margin:0 auto}
.top .h2{max-width:1180px;margin:8px auto 0}
.ve{color:#fff;text-decoration:none;font-weight:600;font-size:13px;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:99px;white-space:nowrap}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}

.inut{border:0;background:rgba(255,255,255,.16);color:#fff;min-width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}

nav.ben{display:none}
main{flex:1;min-width:0;padding:14px 16px 120px}

}
nav.ben button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink);text-align:left;font-weight:600}

nav.ben button.on{background:var(--xn);color:var(--x)}
.dem{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--dn);color:var(--do);border-radius:99px;padding:0 7px;line-height:18px}
.dem.xanh{background:var(--xn);color:var(--x)} .dem.vang{background:var(--vn);color:var(--vang)}

.luoi{display:grid;gap:0 14px}

.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--x);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;margin-top:1px;padding:0}

.gioc{flex:none;min-width:46px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--x);padding-top:1px}

.ten{font-weight:600;overflow-wrap:anywhere}

.phu{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:2px;align-items:center}
.ghichu{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:0 8px;line-height:19px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.n-lanest{background:var(--xn);color:var(--x)} .n-kenh{background:var(--cn);color:var(--cam)} .n-hoc{background:var(--ln);color:var(--lam)}
.n-gd{background:var(--hn);color:var(--hong)} .n-banthan{background:var(--tn);color:var(--tim)}
.c-ai{background:var(--ln);color:var(--lam)} .c-do{background:var(--dn);color:var(--do)} .c-vang{background:var(--vn);color:var(--vang)} .c-xanh{background:var(--xn);color:var(--x)}
.thanh{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}

.loc{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}

.hang{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nhanh{margin-bottom:12px}
.nhanh .hang{flex-wrap:nowrap}

.trong{color:var(--muted);font-size:13.5px;padding:4px 0}
.nhomt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px;display:flex;gap:6px;align-items:center}
.nhomt.do{color:var(--do)}
.so4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.so4{grid-template-columns:repeat(4,1fr)}}
.so{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);border-top:4px solid var(--c,var(--x))}
.so .lb{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.so .v{font-size:24px;font-weight:800;color:var(--c,var(--x));font-variant-numeric:tabular-nums;line-height:1.25}
.so .p{font-size:12px;color:var(--muted)}
.thang{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.thang .th{font-size:11px;text-align:center;color:var(--muted);font-weight:700}
.thang button{aspect-ratio:1/1;border:0;border-radius:10px;background:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;font-size:14px;color:var(--ink);padding:0;min-width:0}

.thang button.le{color:var(--do)}
.thang .cham{display:flex;gap:2px;height:6px}
.thang .cham i{width:5px;height:5px;border-radius:50%;background:var(--la)}

.tqhang{display:flex;gap:4px;margin-top:6px}
.tqhang button{flex:1;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:3px 0;font-size:11px;cursor:pointer;color:var(--muted);line-height:1.25}
.tqhang button b{display:block;font-size:13px;color:var(--ink)}
.tqhang button.co{background:var(--x);border-color:var(--x);color:#fff}
.tqhang button.co b{color:#fff}
.tqhang button.khong{opacity:.35;cursor:default}
.moc{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.moc input{width:18px;height:18px;accent-color:var(--x);flex:none}
.moc.xong span{text-decoration:line-through;color:var(--muted)}
.tsv{filter:blur(0)}
.tsan .v{letter-spacing:.06em}
.mo-nen{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media(min-width:900px){.mo-nen{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;gap:8px;align-items:center}
.sheet h3 .sp{flex:1}
.truong{margin-bottom:10px;min-width:0}
.truong>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.truong input:not([type=checkbox]):not([type=range]),.truong select,.truong textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 10px;min-width:0}
.truong textarea{min-height:84px;resize:vertical}
.truong input[type=range]{width:100%;accent-color:var(--x)}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chonl{display:flex;flex-wrap:wrap;gap:6px}
.chonl button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chonl button.on{background:var(--x);border-color:var(--x);color:#fff}
.mocsua{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.mocsua input[type=text]{flex:1}
.mocsua input[type=date]{width:150px;flex:none}
.mocsua input[type=checkbox]{width:20px;height:20px;accent-color:var(--x);flex:none}
.xoamoc{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
.nutday{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.nutday .sp{flex:1}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
.toast.on{opacity:1}
#chan{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:50}
#chan .the{max-width:380px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-weight:700;text-align:left}
.menu button .i{font-size:22px}
.lk{font-size:12.5px;overflow-wrap:anywhere}
.ag{border-left:4px solid var(--vang);padding-left:10px}
.ag.do{border-left-color:var(--do)}
</style>

<body>
<header class="top">
  <div class="h1"><a class="ve" href="./" id="veApp">‹ App LA</a><span id="trangThai"></span>
    <button class="inut" id="nTim" title="Tìm" aria-label="Tìm">🔍</button><button class="inut" id="nLai" title="Tải lại" aria-label="Tải lại">↻</button><button class="inut" id="nNen" title="Đổi nền sáng/tối" aria-label="Đổi nền sáng tối">🌓</button></div>
  <div class="h2"><h1 id="chao">Trình cá nhân</h1><div class="ngay" id="ngayNay"></div></div>
</header>

  <main id="noi"></main>
</div>
<nav class="day" id="day" aria-label="Các mục chính"></nav>
<button class="fab" id="fab" aria-label="Thêm mới">+</button>
<div class="toast" id="toast"></div>
<div id="chan"><div class="the"><h3 id="chanTieuDe" style="justify-content:center">Đang mở…</h3><p class="muted" id="chanNoiDung">Đang lấy dữ liệu từ app LA.</p><a class="nut an" id="chanNut" href="./" style="display:inline-block;text-decoration:none">Mở app LA để đăng nhập</a></div></div>

<script>
// Trình cá nhân của chị Lê (11/11/2026). Dữ liệu ở máy chủ app LA (cnDuLieu / cnLuu / cnXoa / cnTich, chỉ mã NV12),
// dùng phiên đăng nhập sẵn có của app LA trên máy này. Nhắc việc do máy chủ gửi (cnNhac, 5 phút/lần).
const API='https://oubxfxeosmozsttsobsw.supabase.co/functions/v1/la';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91YnhmeGVvc21venN0dHNvYnN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjg2MjEsImV4cCI6MjEwNjg0NDYyMX0.Vq0h8A8J3OO3KwwzFf_j69JRCQoSZSCvumZRvH5Mhxg';
const TB_KHOA='BNvCUndYQ2vsqjRGtB1d3V3WLunBg1Ma4q3zIUb29Ihycw6mno1K5lThNItSrcGdv433H77d7HF-6jROnggN938';
const KENH_DASH='https://claude.ai/artifact/Qwvz64LB35b6e9qxEa6XQE';
const THU=/[?&]thu=1/.test(location.search), P=THU?'thu_':'';
let TK=null;try{TK=localStorage.getItem(P+'kd_tk')}catch(e){}
if(THU) document.getElementById('veApp').href='thu.html';
const $=id=>document.getElementById(id);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lay=(k,mac)=>{try{const v=localStorage.getItem(k);return v==null?mac:v}catch(x){return mac}};
const dat=(k,v)=>{try{localStorage.setItem(k,v)}catch(x){}};
function goi(f,a){
  if(window.LA_GIA) return window.LA_GIA(f,a);
  return fetch(API,{method:'POST',credentials:'omit',body:JSON.stringify({f,a}),headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+ANON}})
    .then(r=>r.json(),()=>{throw new Error('MAT_MANG')})
    .then(x=>{if(x&&x.loi!=null) throw new Error(x.loi);return x?x.kq:null});
}

// ---------- ngày giờ (giờ Việt Nam, không phụ thuộc múi giờ của máy) ----------
const VN=7*3600e3;
const HN=()=>new Date(Date.now()+VN).toISOString().slice(0,10);
const GIO=()=>new Date(Date.now()+VN).toISOString().slice(11,16);
const nUTC=s=>{const p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]))};
const cong=(s,n)=>{const d=nUTC(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const thu=s=>nUTC(s).getUTCDay();
const kc=(a,b)=>Math.round((nUTC(b)-nUTC(a))/864e5);
const THU_TEN=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'], THU_NGAN=['CN','T2','T3','T4','T5','T6','T7'];
const dm=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const dmy=s=>s?dm(s)+'/'+s.slice(0,4):'';
function nhanNgay(s){
  const h=HN(),k=kc(h,s);
  if(k===0) return 'Hôm nay'; if(k===1) return 'Ngày mai'; if(k===-1) return 'Hôm qua';
  return THU_NGAN[thu(s)]+' '+dm(s)+(s.slice(0,4)!==h.slice(0,4)?'/'+s.slice(0,4):'');
}

// ---------- danh mục ----------
const LOAI={viec:['✅','Việc'],lich:['📅','Lịch hẹn'],kh:['🎯','Kế hoạch'],quyet:['⚖️','Chờ quyết'],hoc:['🎓','Khóa học'],mt:['🏁','Mục tiêu'],tq:['🌱','Thói quen'],bc:['📝','Ghi chép']};
const NHOM={lanest:'Công ty',kenh:'Kênh cá nhân',hoc:'Học tập',gd:'Gia đình & con',banthan:'Bản thân',khac:'Khác'};
const TT_TEN={viec:{mo:'Chưa làm',dang:'Đang làm',xong:'Xong',bo:'Bỏ'},lich:{mo:'Sắp tới',xong:'Đã xong',bo:'Huỷ'},
  kh:{dang:'Đang chạy',cho:'Chờ chốt',mo:'Chưa bắt đầu',hoan:'Tạm hoãn',xong:'Xong',bo:'Bỏ'},quyet:{cho:'Chờ chị quyết',xong:'Đã quyết',bo:'Bỏ'},
  hoc:{dang:'Đang học',cho:'Chờ',mo:'Chưa bắt đầu',xong:'Đã xong'},mt:{dang:'Đang theo',xong:'Đạt',hoan:'Tạm dừng',bo:'Bỏ'},
  tq:{dang:'Đang giữ',hoan:'Tạm dừng',bo:'Bỏ'},bc:{mo:'Ghi chép'}};
const MUC=[['hom-nay','🏠','Hôm nay'],['viec','✅','Việc cần làm'],['lich','📅','Lịch trình'],['ke-hoach','🎯','Kế hoạch & chiến lược'],
  ['cho-quyet','⚖️','Chờ chị quyết'],['hoc','🎓','Khóa học'],['gia-dinh','👨‍👩‍👧','Gia đình & con'],['muc-tieu','🌱','Mục tiêu & thói quen'],
  ['bao-cao','📊','Báo cáo'],['tai-san','💰','Tài sản']];
const DAY=[['hom-nay','🏠','Hôm nay'],['viec','✅','Việc'],['lich','📅','Lịch'],['ke-hoach','🎯','Kế hoạch'],['them','☰','Thêm']];
const MAC_LOAI={'hom-nay':'viec',viec:'viec',lich:'lich','ke-hoach':'kh','cho-quyet':'quyet',hoc:'hoc','gia-dinh':'viec','muc-tieu':'mt','bao-cao':'bc'};
const NHAC=[[-1,'Không nhắc'],[0,'Đúng giờ'],[10,'Trước 10 phút'],[30,'Trước 30 phút'],[60,'Trước 1 giờ'],[120,'Trước 2 giờ'],[1440,'Trước 1 ngày']];

// ---------- dữ liệu ----------
let D={ds:[],choDuyet:[],may:0}, M={}, BAN={}, TAB='hom-nay', LOC='all', TIM='', NGAY_CHON=null, THANG=null, TS=null, DA_NAP=false;
function datDuLieu(d){D={ds:d.ds||[],choDuyet:d.choDuyet||[],may:d.may||0};M={};D.ds.forEach(x=>{M[x.id]=x})}
function luuMay(){dat(P+'cn_h',JSON.stringify({ds:D.ds,choDuyet:D.choDuyet,may:D.may}))}
const mo=x=>x.tt!=='xong'&&x.tt!=='bo';
function coNgay(x,ng){
  const g=x.ngay||'';
  if(!x.lap) return g===ng;
  if((g&&ng<g)||(x.denNgay&&ng>x.denNgay)) return false;
  if(x.lap==='ngay') return true;
  if(x.lap==='tuan'){const t=x.thuLap&&x.thuLap.length?x.thuLap:g?[thu(g)]:[];return t.indexOf(thu(ng))>=0}
  if(x.lap==='thang') return !!g&&g.slice(8)===ng.slice(8);
  return false;
}
const xongNgay=(x,ng)=>!!(x.lap&&x.daTich&&x.daTich[ng]);
const theoGio=(a,b)=>(a.gio||'99:99').localeCompare(b.gio||'99:99')||(b.uuTien||0)-(a.uuTien||0);
const theoNgay=(a,b)=>(a.ngay||'9999').localeCompare(b.ngay||'9999')||theoGio(a,b);
function tenLap(x){
  if(x.lap==='ngay') return 'Mỗi ngày';
  if(x.lap==='tuan'){const t=x.thuLap&&x.thuLap.length?x.thuLap:x.ngay?[thu(x.ngay)]:[];return 'Mỗi tuần'+(t.length?' ('+t.slice().sort((a,b)=>(a||7)-(b||7)).map(i=>THU_NGAN[i]).join(', ')+')':'')}
  if(x.lap==='thang') return 'Mỗi tháng'+(x.ngay?' (ngày '+(+x.ngay.slice(8))+')':'');
  return '';
}
function tgDaDi(x){if(!x.ngay||!x.denNgay) return null;const t=kc(x.ngay,x.denNgay)||1;return Math.max(0,Math.min(100,Math.round(kc(x.ngay,HN())*100/t)))}
function mocToi(x){return (x.moc||[]).filter(m=>!m.xong).sort((a,b)=>(a.ngay||'9999').localeCompare(b.ngay||'9999'))[0]}
function viecQuaHan(){const h=HN();return D.ds.filter(x=>(x.loai==='viec'||x.loai==='quyet')&&mo(x)&&!x.lap&&x.ngay&&x.ngay<h)}
function demChoQuyet(){return D.ds.filter(x=>x.loai==='quyet'&&mo(x)).length+D.choDuyet.length}

// ---------- hàng đợi lưu (lưu ngay trên máy, gửi máy chủ theo thứ tự) ----------
let HANG=[],DANG=false;
function trangThai(t){$('trangThai').textContent=t}
function bao(t){const x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(bao.h);bao.h=setTimeout(()=>x.classList.remove('on'),2600)}
function chan(tieuDe,noiDung,nut){$('chan').classList.remove('an');$('chanTieuDe').textContent=tieuDe;$('chanNoiDung').textContent=noiDung;$('chanNut').classList.toggle('an',!nut);if(THU) $('chanNut').href='thu.html'}
function day1(op){HANG.push(op);chay()}
function chay(){
  if(DANG||!HANG.length) return;
  DANG=true;trangThai('Đang lưu…');
  const op=HANG[0];let p;
  if(op.f==='luu') p=goi('cnLuu',[TK,Object.assign({id:op.id},op.x),BAN[op.id]||'']).then(r=>{BAN[r.id]=r.capNhat;nhanVe(r)});
  else if(op.f==='xoa') p=goi('cnXoa',[TK,op.id]).then(()=>{delete BAN[op.id]});
  else if(op.f==='tich') p=goi('cnTich',[TK,op.id,op.ngay,op.co]).then(r=>{BAN[r.id]=r.capNhat;nhanVe(r)});
  else if(op.f==='ag') p=goi('agQuyetDinh',[TK,op.id,op.qd,op.ghiChu||'']);
  else p=Promise.resolve();
  p.then(()=>{HANG.shift();DANG=false;luuMay();if(!HANG.length) trangThai('✓ Đã lưu '+GIO());chay()})
  .catch(err=>{
    DANG=false;
    if(/HET_PHIEN/.test(err.message)){chan('Phiên đăng nhập đã hết','Chị mở app LA đăng nhập lại, rồi bấm ô "Trình cá nhân". Thay đổi vừa rồi chưa lưu được.',true);return}
    if(err.message==='MAT_MANG'){trangThai('⚠ Mất mạng, em thử lại sau 5 giây');setTimeout(chay,5000);return}
    HANG.shift();
    if(/DA_SUA_NOI_KHAC/.test(err.message)) bao('Mục này vừa được sửa ở máy khác. Em tải bản mới, chị sửa lại giúp em nhé.');
    else bao('Chưa lưu được: '+err.message);
    napLai();chay();
  });
}
function nhanVe(r){
  if(HANG.slice(1).some(o=>o.id===r.id)) return;
  M[r.id]=r;const i=D.ds.findIndex(x=>x.id===r.id);if(i>=0) D.ds[i]=r;else D.ds.push(r);
}
function luu(x){
  const moi=Object.assign({},M[x.id]||{},x);
  M[x.id]=moi;const i=D.ds.findIndex(y=>y.id===x.id);if(i>=0) D.ds[i]=moi;else D.ds.push(moi);
  ve();day1({f:'luu',id:x.id,x:x});
}
function idMoi(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function xongViec(id){
  const x=M[id];if(!x) return;
  if(x.loai==='quyet'&&x.tt!=='xong'){moQuyet(id);return}
  const xg=x.tt!=='xong';
  luu({id,loai:x.loai,tt:xg?'xong':(x.loai==='kh'||x.loai==='hoc'||x.loai==='mt'?'dang':'mo'),xongLuc:xg?HN()+' '+GIO():''});
  if(xg) bao('👏 Xong: '+x.ten);
}
function tichNgay(id,ng){
  const x=M[id];if(!x) return;
  const t=Object.assign({},x.daTich||{}),co=!t[ng];if(co) t[ng]=1;else delete t[ng];
  const moi=Object.assign({},x,{daTich:t});M[id]=moi;const i=D.ds.findIndex(y=>y.id===id);if(i>=0) D.ds[i]=moi;
  ve();day1({f:'tich',id,ngay:ng,co});
  if(co) bao('👏 '+x.ten);
}
function xoaMuc(id){
  const x=M[id];if(!x||!confirm('Xoá "'+x.ten+'"? Xoá rồi không lấy lại được.')) return;
  D.ds=D.ds.filter(y=>y.id!==id);delete M[id];dong();ve();day1({f:'xoa',id});
}

// ---------- nạp ----------
let LUC_NAP=0;
function napLai(){
  if(!TK){chan('Chưa đăng nhập','Chị mở app LA, đăng nhập bằng mã của chị, rồi bấm ô "Trình cá nhân" ở trang chủ.',true);return Promise.resolve()}
  if(HANG.length) return Promise.resolve();
  trangThai('Đang tải…');
  return goi('cnDuLieu',[TK]).then(r=>{
    LUC_NAP=Date.now();datDuLieu(r);BAN={};D.ds.forEach(x=>{BAN[x.id]=x.capNhat});luuMay();DA_NAP=true;
    $('chan').classList.add('an');trangThai('✓ Cập nhật '+GIO());ve();
  }).catch(err=>{
    const m=err.message||'';
    if(/HET_PHIEN/.test(m)) chan('Phiên đăng nhập đã hết','Chị mở app LA đăng nhập lại, rồi bấm ô "Trình cá nhân" ở trang chủ.',true);
    else if(/chỉ dành riêng/.test(m)) chan('Không có quyền','Mục này chỉ dành riêng cho chị Lê.',true);
    else if(/Không có chức năng/.test(m)) chan('Máy chủ chưa có trình cá nhân','Em đang cập nhật máy chủ app LA. Chị đợi vài phút rồi mở lại nhé.',true);
    else if(D.ds.length) trangThai('⚠ Chưa tải được, đang xem bản lưu trên máy');
    else chan('Chưa mở được',m==='MAT_MANG'?'Không kết nối được máy chủ. Kiểm tra mạng rồi mở lại.':m,false);
  });
}

// ---------- khung: thanh mục ----------
function veKhung(){
  const qh=viecQuaHan().filter(x=>x.loai==='viec').length,cq=demChoQuyet();
  const dem={'viec':qh?'<span class="dem">'+qh+'</span>':'','cho-quyet':cq?'<span class="dem vang">'+cq+'</span>':''};
  $('ben').innerHTML=MUC.map(m=>'<button data-tab="'+m[0]+'" class="'+(TAB===m[0]?'on':'')+'"><span>'+m[1]+'</span>'+e(m[2])+(dem[m[0]]||'')+'</button>').join('');
  const trongDay=DAY.some(m=>m[0]===TAB);
  $('day').innerHTML=DAY.map(m=>'<button data-tab="'+m[0]+'" class="'+(TAB===m[0]||(m[0]==='them'&&!trongDay)?'on':'')+'"><span class="i">'+m[1]+'</span>'+e(m[2])+(m[0]==='viec'&&qh?'<span class="dem">'+qh+'</span>':m[0]==='them'&&cq?'<span class="dem vang">'+cq+'</span>':'')+'</button>').join('');
  $('fab').classList.toggle('an',TAB==='tai-san');
  const h=HN(),g=+GIO().slice(0,2);
  $('chao').textContent=(g<11?'Chào buổi sáng':g<14?'Chào buổi trưa':g<18?'Chào buổi chiều':'Chào buổi tối')+', chị Lê';
  $('ngayNay').textContent=THU_TEN[thu(h)]+', '+dmy(h)+' · Trình cá nhân';
}
function ve(){
  veKhung();
  const f={'hom-nay':veHomNay,viec:veViec,lich:veLich,'ke-hoach':veKeHoach,'cho-quyet':veChoQuyet,hoc:veHoc,'gia-dinh':veGiaDinh,'muc-tieu':veMucTieu,'bao-cao':veBaoCao,'tai-san':veTaiSan}[TAB]||veHomNay;
  $('noi').innerHTML=f();
  if(TAB==='hom-nay'||TAB==='viec'||TAB==='gia-dinh') ganNhanh();
  if(TAB==='hom-nay') kiemMayNay();
}
function chuyen(t){
  if(t==='them'){moMenu();return}
  TAB=t;LOC='all';TIM='';
  if(location.hash!=='#'+t) history.replaceState(null,'','#'+t);
  ve();window.scrollTo(0,0);
}

// ---------- mẩu hiển thị ----------
function chipNhom(x){return x.nhom?'<span class="chip n-'+e(x.nhom)+'">'+e(NHOM[x.nhom]||'')+'</span>':''}
function chipAI(x){return x.ai&&!x.chiSua?'<span class="chip c-ai">AI thêm</span>':''}
function chipUu(x){return x.uuTien===2?'<span class="chip c-do">Gấp</span>':x.uuTien===1?'<span class="chip c-vang">Quan trọng</span>':''}
function dongViec(x,ng,anNgay){
  const lap=!!x.lap,ngay=ng||HN(),xg=lap?xongNgay(x,ngay):x.tt==='xong';
  const qh=!lap&&x.ngay&&x.ngay<HN()&&mo(x);
  const phu=[];
  if(x.ngay&&!lap&&!anNgay) phu.push(qh?'<span class="chip c-do">Quá hạn · '+e(nhanNgay(x.ngay))+'</span>':'<span>'+e(nhanNgay(x.ngay))+'</span>');
  if(x.gio) phu.push('<span>⏰ '+e(x.gio)+'</span>');
  if(lap) phu.push('<span>🔁 '+e(tenLap(x))+'</span>');
  if(x.loai==='quyet') phu.push('<span class="chip c-vang">Chờ quyết</span>');
  if(x.loai==='viec'&&x.tt==='dang') phu.push('<span class="chip c-xanh">Đang làm</span>');
  const cha=x.cha&&M[x.cha]?'🎯 '+e(M[x.cha].ten):'';
  return '<div class="dong'+(xg?' xong':'')+'"><button class="chk'+(xg?' xong':'')+'" data-act="'+(lap?'tich':'xong')+'" data-id="'+e(x.id)+'" data-ngay="'+ngay+'" aria-label="Đánh dấu xong">'+(xg?'✓':'')+'</button>'+
    '<div class="nd" data-act="sua" data-id="'+e(x.id)+'"><div class="ten">'+e(x.ten)+'</div><div class="phu">'+phu.join('')+chipUu(x)+chipNhom(x)+chipAI(x)+(cha?'<span>'+cha+'</span>':'')+'</div></div></div>';
}
function dongLich(o){ // o = {x, gio, ten, phu, loai}
  const x=o.x;
  return '<div class="dong"><div class="gioc">'+(o.gio?e(o.gio):'<span class="muted nho">'+(x.ngay||x.lap?'cả ngày':'chưa có giờ')+'</span>')+'</div><div class="nd" data-act="sua" data-id="'+e(x.id)+'"><div class="ten">'+(o.icon||'')+e(o.ten)+'</div><div class="phu">'+(o.phu||'')+chipNhom(x)+chipAI(x)+'</div></div></div>';
}
function rong(t){return '<div class="trong">'+t+'</div>'}
function nhanhHtml(goiY){return '<div class="the nhanh"><div class="hang"><input id="nhanhO" placeholder="'+e(goiY||'Thêm nhanh: Gọi đại lý mai 9h')+'" autocomplete="off" enterkeyhint="done"><button class="nut" id="nhanhNut">Thêm</button></div><div class="doan" id="nhanhDoan"></div></div>'}

// Mục xuất hiện trong ngày ng (cho Lịch, Hôm nay, Sắp tới)
function suKien(ng,coViec){
  const out=[];
  D.ds.forEach(x=>{
    if(x.tt==='bo') return;
    if(x.loai==='lich'&&coNgay(x,ng)) out.push({x,gio:x.gio,ten:x.ten,icon:'📅 ',phu:(x.gioDen?'<span>đến '+e(x.gioDen)+'</span>':'')+(x.noi?'<span>📍 '+e(x.noi)+'</span>':'')+(x.lap?'<span>🔁 '+e(tenLap(x))+'</span>':'')});
    else if(coViec&&(x.loai==='viec'||x.loai==='quyet')&&coNgay(x,ng)&&!(x.tt==='xong'&&!x.lap)) out.push({x,gio:x.gio,ten:x.ten,icon:x.loai==='quyet'?'⚖️ ':'✅ ',phu:x.loai==='quyet'?'<span>Hạn quyết</span>':''});
    else if(x.loai==='hoc'&&x.lap&&x.gio&&coNgay(x,ng)&&mo(x)) out.push({x,gio:x.gio,ten:x.ten,icon:'🎓 ',phu:'<span>Buổi học</span>'});
    if(x.loai==='kh'||x.loai==='hoc'||x.loai==='mt'){
      if(x.ngay===ng&&!(x.loai==='hoc'&&x.lap)) out.push({x,ten:'Bắt đầu: '+x.ten,icon:LOAI[x.loai][0]+' '});
      if(x.denNgay===ng) out.push({x,ten:(x.loai==='mt'?'Hạn mục tiêu: ':'Kết thúc: ')+x.ten,icon:LOAI[x.loai][0]+' '});
      (x.moc||[]).forEach(m=>{if(m.ngay===ng) out.push({x,ten:(m.xong?'✓ ':'')+m.ten,icon:'📍 ',phu:'<span>'+e(x.ten)+'</span>'})});
    }
  });
  return out.sort((a,b)=>(a.gio||'').localeCompare(b.gio||''));
}

// ---------- HÔM NAY ----------
function veHomNay(){
  const h=HN();
  const viecHn=D.ds.filter(x=>(x.loai==='viec'||x.loai==='quyet')&&mo(x)&&coNgay(x,h)).sort(theoGio);
  const qh=viecQuaHan().sort(theoNgay);
  const xongHn=D.ds.filter(x=>(x.xongLuc||'').slice(0,10)===h||(x.lap&&x.loai==='viec'&&xongNgay(x,h))).length;
  const lich=suKien(h,false);
  const tq=D.ds.filter(x=>x.loai==='tq'&&x.tt==='dang'&&coNgay(x,h));
  const cq=D.ds.filter(x=>x.loai==='quyet'&&mo(x)).sort(theoNgay);
  const kh=D.ds.filter(x=>x.loai==='kh'&&x.tt==='dang').sort((a,b)=>(a.denNgay||'9999').localeCompare(b.denNgay||'9999'));
  let s=nhanhHtml();
  s+='<div class="luoi"><div>';
  s+='<div class="the"><h3>✅ Cần làm hôm nay<span class="sp"></span>'+(xongHn?'<span class="chip c-xanh">Đã xong '+xongHn+'</span>':'')+'</h3>'+
    (qh.length?'<div class="nhomt do">Quá hạn ('+qh.length+')</div>'+qh.slice(0,8).map(x=>dongViec(x)).join('')+(qh.length>8?'<div class="trong"><a href="#viec" data-tab="viec">Xem hết '+qh.length+' việc quá hạn</a></div>':''):'')+
    (qh.length&&viecHn.length?'<div class="nhomt">Hôm nay</div>':'')+
    (viecHn.length?viecHn.map(x=>dongViec(x,h,true)).join(''):(qh.length?'':rong('Hôm nay chưa có việc nào. Gõ vào ô Thêm nhanh ở trên.')))+'</div>';
  s+='<div class="the"><h3>📅 Lịch hôm nay</h3>'+(lich.length?lich.map(dongLich).join(''):rong('Không có lịch hẹn.'))+'</div>';
  if(tq.length) s+='<div class="the"><h3>🌱 Thói quen hôm nay</h3>'+tq.map(x=>dongViec(x,h,true)).join('')+'</div>';
  s+='</div><div>';
  if(cq.length||D.choDuyet.length) s+='<div class="the"><h3>⚖️ Chờ chị quyết<span class="sp"></span><button class="nut rong nho" data-tab="cho-quyet">Xem '+(cq.length+D.choDuyet.length)+'</button></h3>'+
    D.choDuyet.slice(0,2).map(a=>'<div class="dong"><div class="nd" data-tab="cho-quyet"><div class="ten">🤖 '+e(a.tomTat)+'</div><div class="phu"><span>Phòng Agent đề xuất</span></div></div></div>').join('')+
    cq.slice(0,3).map(x=>dongViec(x)).join('')+'</div>';
  s+='<div class="the"><h3>🗓 7 ngày tới<span class="sp"></span><button class="nut rong nho" data-tab="lich">Xem lịch</button></h3>'+sapToi(h,7,true)+'</div>';
  if(kh.length) s+='<div class="the"><h3>🎯 Kế hoạch đang chạy<span class="sp"></span><button class="nut rong nho" data-tab="ke-hoach">Xem '+kh.length+'</button></h3>'+kh.slice(0,3).map(khGon).join('')+'</div>';
  s+='<div class="the" id="tbThe"><h3>🔔 Nhắc việc trên điện thoại</h3><div class="nho muted" id="tbTT">'+(D.may?'Đang bật trên '+D.may+' máy của chị. Việc có giờ sẽ được nhắc trước (mặc định 30 phút); 7:30 sáng báo việc hôm nay, 21:00 báo việc chưa xong.':'Chưa có máy nào bật nhắc việc.')+'</div><div class="hang" style="margin-top:8px"><button class="nut nho" id="tbBat">Bật trên máy này</button></div></div>';
  s+='</div></div>';
  return s;
}
function sapToi(tu,n,gon){ // gon (trang Hôm nay): chỉ việc, chờ quyết, lịch hẹn 1 lần — bỏ lịch lặp lại, mốc kế hoạch; mỗi ngày tối đa 3 dòng
  let s='',co=false;const toiDa=gon?3:6;
  for(let i=1;i<=n;i++){
    const ng=cong(tu,i),ds=suKien(ng,true).filter(o=>!gon||(!o.x.lap&&['kh','hoc','mt'].indexOf(o.x.loai)<0));
    if(!ds.length) continue;co=true;
    s+='<div class="nhomt">'+e(THU_TEN[thu(ng)])+' '+dm(ng)+'</div>'+ds.slice(0,toiDa).map(dongLich).join('')+(ds.length>toiDa?'<div class="trong">+'+(ds.length-toiDa)+' mục nữa</div>':'');
  }
  return co?s:rong('Chưa có gì trong '+n+' ngày tới.');
}
function khGon(x){
  const tg=tgDaDi(x),m=mocToi(x);
  return '<div class="dong"><div class="nd" data-act="sua" data-id="'+e(x.id)+'"><div class="ten">'+e(x.ten)+'</div><div class="phu">'+(x.ngay||x.denNgay?'<span>'+e(dm(x.ngay))+(x.denNgay?' → '+e(dm(x.denNgay)):'')+'</span>':'')+(x.tienDo!=null?'<span>Tiến độ '+x.tienDo+'%</span>':'')+(m?'<span>📍 '+e(m.ten)+(m.ngay?' ('+e(dm(m.ngay))+')':'')+'</span>':'')+'</div>'+
    (x.tienDo!=null?'<div class="thanh"><i style="width:'+x.tienDo+'%"></i></div>':tg!=null?'<div class="thanh tg"><i style="width:'+tg+'%"></i></div>':'')+'</div></div>';
}

// ---------- VIỆC ----------
function locHtml(cacNhom){
  return '<div class="loc">'+[['all','Tất cả']].concat(cacNhom.map(k=>[k,NHOM[k]])).map(o=>'<button data-loc="'+o[0]+'" class="'+(LOC===o[0]?'on':'')+'">'+e(o[1])+'</button>').join('')+'</div>';
}
function veViec(){

function thongKe(tu,den){
  const h=HN(),toi=den<h?den:h;
  const viecHan=D.ds.filter(x=>x.loai==='viec'&&!x.lap&&x.ngay>=tu&&x.ngay<=den);
  const xong=D.ds.filter(x=>(x.loai==='viec'||x.loai==='quyet')&&x.tt==='xong'&&(x.xongLuc||'').slice(0,10)>=tu&&(x.xongLuc||'').slice(0,10)<=den);
  let tqCan=0,tqCo=0,lapXong=0;
  D.ds.forEach(x=>{if(!(x.loai==='tq'||(x.loai==='viec'&&x.lap))||x.tt==='bo') return;
    for(let ng=tu;ng<=toi;ng=cong(ng,1)){if(!coNgay(x,ng)) continue;if(x.loai==='tq'){tqCan++;if(x.daTich&&x.daTich[ng]) tqCo++}else if(x.daTich&&x.daTich[ng]) lapXong++}});
  const lich=[];for(let ng=tu;ng<=den;ng=cong(ng,1)) D.ds.forEach(x=>{if(x.loai==='lich'&&x.tt!=='bo'&&coNgay(x,ng)) lich.push(x)});
  return {viecHan,xongHan:viecHan.filter(x=>x.tt==='xong').length,xong:xong.length+lapXong,quyet:xong.filter(x=>x.loai==='quyet').length,tq:tqCan?Math.round(tqCo*100/tqCan):null,tqCan,tqCo,lich:lich.length};
}

function parseNum(raw){
  if(raw==null) return null;
  let s=String(raw).trim().toLowerCase();
  if(s==='') return null;
  s=s.replace(/đ|vnd|vnđ|\s/g,'').replace(/[x×]/g,'*').replace(/:/g,'/');
  s=s.replace(/\d{1,3}(?:\.\d{3})+(?![\d,])/g,m=>m.replace(/\./g,''));
  s=s.replace(/(\d),(\d)/g,'$1.$2');
  s=s.replace(/(\d+(?:\.\d+)?)(tỷ|tỉ|ty|ti)/g,'($1*1e9)').replace(/(\d+(?:\.\d+)?)(triệu|trieu|tr)/g,'($1*1e6)').replace(/(\d+(?:\.\d+)?)(nghìn|ngàn|k)/g,'($1*1e3)');
  if(!/^[\d.+\-*/()e]+$/.test(s)) return NaN;
  try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?Math.round(v):NaN}catch(x){return NaN}
}

const THU_SO={'hai':1,'2':1,'ba':2,'3':2,'tư':3,'4':3,'năm':4,'5':4,'sáu':5,'6':5,'bảy':6,'7':6};
function phanTich(txt){
  let s=' '+String(txt||'').replace(/\s+/g,' ')+' ',ngay='',gio='',lap='',thuLap=[],ngam=false,m;
  const h=HN(),bo=x=>{s=s.replace(x,' ')};
  if((m=s.match(/\s(?:mỗi|hằng|hàng)\s+ngày(?=\s)/i))){lap='ngay';bo(m[0])}
  else if((m=s.match(/\smỗi\s+(?:thứ|t)\s*(hai|ba|tư|năm|sáu|bảy|[2-7])(?=\s)/i))){lap='tuan';thuLap=[THU_SO[m[1].toLowerCase()]];bo(m[0])}
  else if((m=s.match(/\smỗi\s+(?:chủ nhật|cn)(?=\s)/i))){lap='tuan';thuLap=[0];bo(m[0])}
  else if((m=s.match(/\s(?:mỗi|hằng|hàng)\s+tuần(?=\s)/i))){lap='tuan';bo(m[0])}
  else if((m=s.match(/\s(?:mỗi|hằng|hàng)\s+tháng(?=\s)/i))){lap='thang';bo(m[0])}
  if((m=s.match(/\s(\d{1,2})\s*(?:h|g|giờ|:)\s*(\d{1,2})?\s*(?:phút|p)?\s*(sáng|trưa|chiều|tối|đêm)?(?=\s)/i))){
    let hh=+m[1],mm=+(m[2]||0);const b=(m[3]||'').toLowerCase();
    if((b==='chiều'||b==='tối')&&hh<12) hh+=12;if(b==='trưa'&&hh<5) hh+=12;if(b==='đêm'&&hh===12) hh=0;
    if(hh<24&&mm<60){gio=('0'+hh).slice(-2)+':'+('0'+mm).slice(-2);bo(m[0])}
  }
  if((m=s.match(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/))){
    let y=m[3]?+m[3]:+h.slice(0,4);if(y<100) y+=2000;const d=+m[1],mo2=+m[2];
    if(d>=1&&d<=31&&mo2>=1&&mo2<=12){let v=y+'-'+('0'+mo2).slice(-2)+'-'+('0'+d).slice(-2);if(!m[3]&&v<cong(h,-1)) v=(y+1)+v.slice(4);ngay=v;bo(m[0])}
  }
  else if((m=s.match(/\s(hôm nay|tối nay|sáng nay|chiều nay)(?=\s)/i))){ngay=h;if(/tối|chiều/i.test(m[1])&&gio&&+gio.slice(0,2)<12) gio=('0'+(+gio.slice(0,2)+12)).slice(-2)+gio.slice(2);bo(m[0])}
  else if((m=s.match(/\s(ngày mai|mai)(?=\s)/))){ngay=cong(h,1);bo(m[0])}
  else if((m=s.match(/\s(ngày mốt|mốt|ngày kia)(?=\s)/))){ngay=cong(h,2);bo(m[0])}
  else if((m=s.match(/\s(?:thứ|t)\s*(hai|ba|tư|năm|sáu|bảy|[2-7])(?:\s+(?:này|tới|tuần này))?(?=\s)/i))){let k=(THU_SO[m[1].toLowerCase()]-thu(h)+7)%7;if(k===0) k=7;ngay=cong(h,k);bo(m[0])}
  else if((m=s.match(/\s(?:chủ nhật|cn)(?:\s+(?:này|tới))?(?=\s)/i))){let k=(7-thu(h))%7;if(k===0) k=7;ngay=cong(h,k);bo(m[0])}
  if(!ngay&&(gio||lap)){ngay=h;ngam=true}
  if(ngam&&!lap&&gio&&gio<=GIO()) ngay=cong(h,1);
  let ten=s.replace(/\s+/g,' ').trim();ten=ten.charAt(0).toUpperCase()+ten.slice(1);
  return {ten,ngay,gio,lap,thuLap};
}

  s+='<div class="nutday"><button class="nut" data-act="luusua">Lưu</button>'+(!moi&&(x.loai==='viec'||x.loai==='quyet')&&!x.lap&&x.tt!=='xong'?'<button class="nut rong" data-act="xongsua">✓ '+(x.loai==='quyet'?'Đã quyết':'Xong')+'</button>':'')+'<span class="sp"></span>'+(!moi?'<button class="nut do" data-act="xoasua">Xoá</button>':'')+'<button class="nut xam" data-act="dong">Đóng</button></div>';
  const cuon=$('moNen')?$('moNen').querySelector('.sheet').scrollTop:0;
  moSheet(s);SUA=x;$('moNen').querySelector('.sheet').scrollTop=cuon;
  const l=$('f_lap');if(l) l.onchange=()=>{docSua();SUA.lap=l.value;veSua(moi)};
  const td=$('f_tienDo');if(td) td.oninput=()=>{$('tdSo').textContent=td.value+'%'};
  if(moi&&!x.ten) setTimeout(()=>{const t=$('f_ten');if(t) t.focus()},60);
  SUA._moi=moi;
}
function docSua(){
  const x=SUA,v=k=>{const o=$('f_'+k);return o?o.value:undefined};
  ['ten','nhom','thay','chiTieu','ngay','denNgay','gio','gioDen','noi','ketQua','ghiChu','link','tt','cha','lap'].forEach(k=>{const z=v(k);if(z!==undefined) x[k]=k==='ten'?z.trim():z});
  const nh=v('nhac');if(nh!==undefined) x.nhac=+nh;
  const ut=v('uuTien');if(ut!==undefined) x.uuTien=+ut;
  const td=$('f_tienDo');if(td) x.tienDo=+td.value;
  if($('mocDs')){x.moc=[].map.call(document.querySelectorAll('#mocDs .mocsua'),r=>({ten:r.querySelector('.mt2').value.trim(),ngay:r.querySelector('.md').value,xong:r.querySelector('.mx').checked}))}
  return x;
}
function luuSua(xong){
  const x=docSua(),moi=x._moi;
  if(!x.ten){bao('Chị gõ tên giúp em nhé.');const t=$('f_ten');if(t) t.focus();return}
  if(x.lap==='tuan'&&(!x.thuLap||!x.thuLap.length)&&x.ngay) x.thuLap=[thu(x.ngay)];
  if(x.lap&&!x.ngay) x.ngay=HN();
  if(xong){x.tt='xong';x.xongLuc=HN()+' '+GIO()}
  const gui={};['id','loai','ten','nhom','thay','chiTieu','ngay','denNgay','gio','gioDen','noi','ketQua','ghiChu','link','tt','cha','lap','thuLap','nhac','uuTien','tienDo','moc','xongLuc'].forEach(k=>{if(x[k]!==undefined) gui[k]=x[k]});
  if(!(TRUONG[x.loai]||[]).includes('moc')) delete gui.moc;
  if(!(TRUONG[x.loai]||[]).includes('tienDo')) delete gui.tienDo;
  dong();luu(gui);bao(moi?'✓ Đã thêm':'✓ Đã lưu');
}

// ---------- menu "Thêm" (điện thoại) + tìm ----------
function moMenu(){

function moTim(){
  moSheet('<h3>🔍 Tìm trong trình<span class="sp"></span><button class="nut xam nho" data-act="dong">✕</button></h3><div class="truong"><input id="timTat" placeholder="Gõ chữ cần tìm, không cần dấu" autocomplete="off"></div><div id="timKq"></div>');
  const o=$('timTat');o.focus();
  o.oninput=()=>{const t=boDau(o.value.trim());if(!t){$('timKq').innerHTML='';return}

    $('timKq').innerHTML=kq.length?kq.map(x=>'<div class="dong"><div class="nd" data-act="sua" data-id="'+e(x.id)+'"><div class="ten">'+LOAI[x.loai][0]+' '+e(x.ten)+'</div><div class="phu"><span>'+e(LOAI[x.loai][1])+'</span>'+(x.ngay?'<span>'+e(nhanNgay(x.ngay))+'</span>':'')+chipNhom(x)+'</div></div></div>').join(''):rong('Không thấy mục nào.')};
}

// ---------- thông báo trên máy này ----------
function tbKhoa(){const s=TB_KHOA.replace(/-/g,'+').replace(/_/g,'/'),b=atob(s+'==='.slice((s.length+3)%4)),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);return u}
const coPush=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function kiemMayNay(){
  const b=$('tbBat');if(!b) return;
  if(!coPush()){b.disabled=true;$('tbTT').textContent+=/iPhone|iPad/.test(navigator.userAgent)?' iPhone: mở app LA trong Safari → Chia sẻ → "Thêm vào MH chính", rồi mở app từ biểu tượng và bấm Bật.':' Trình duyệt này chưa nhận được thông báo, chị dùng Chrome nhé.';return}
  navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(s=>{if(s&&$('tbBat')){$('tbBat').textContent='Máy này đã bật · bật lại';}}).catch(()=>{});
  b.onclick=()=>{
    Notification.requestPermission().then(p=>{if(p!=='granted') throw new Error('Chưa cho phép thông báo. Vào cài đặt điện thoại, cho phép thông báo của app LA rồi bấm lại.');return navigator.serviceWorker.ready})
    .then(r=>r.pushManager.getSubscription().then(s=>s||r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:tbKhoa()})))
    .then(s=>goi('tbDangKy',[TK,s.toJSON(),navigator.userAgent]))
    .then(r=>{D.may=Math.max(D.may,(r&&r.so)||1);bao('✓ Đã bật nhắc việc trên máy này');ve()})
    .catch(err=>bao(err.message));
  };
}

// ---------- bấm ----------
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-tab],[data-act],[data-loc]');if(!t) return;
  if(t.dataset.tab){ev.preventDefault();dong();chuyen(t.dataset.tab);return}
  if(t.dataset.loc){LOC=t.dataset.loc;ve();return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='xong') xongViec(id);
  else if(a==='tich'){if(id&&t.dataset.ngay) tichNgay(id,t.dataset.ngay)}
  else if(a==='sua') moSua(id);
  else if(a==='dong') dong();
  else if(a==='moc'){const x=M[id],i=+t.dataset.i;if(!x) return;const moc=(x.moc||[]).map((m,j)=>j===i?Object.assign({},m,{xong:t.checked}):m);luu({id,loai:x.loai,moc})}
  else if(a==='thang'){const p=THANG.split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1+(+t.dataset.n),1));THANG=d.toISOString().slice(0,7);NGAY_CHON=THANG+'-01';ve()}
  else if(a==='homnay'){THANG=null;NGAY_CHON=null;ve()}
  else if(a==='ngay'){NGAY_CHON=t.dataset.ngay;if(NGAY_CHON.slice(0,7)!==THANG) THANG=NGAY_CHON.slice(0,7);ve()}
  else if(a==='themngay') moSua(null,{loai:'lich',ngay:t.dataset.ngay});
  else if(a==='themloai') moSua(null,{loai:t.dataset.loai,ngay:t.dataset.loai==='bc'?HN():''});
  else if(a==='doiloai'){docSua();SUA.loai=t.dataset.loai;SUA.tt='';veSua(true)}
  else if(a==='thu'){docSua();const i=+t.dataset.i,ds=(SUA.thuLap||[]).slice(),k=ds.indexOf(i);if(k>=0) ds.splice(k,1);else ds.push(i);SUA.thuLap=ds;veSua(SUA._moi)}
  else if(a==='themmoc'){docSua();SUA.moc=(SUA.moc||[]).concat([{ten:'',ngay:'',xong:false}]);veSua(SUA._moi);const o=document.querySelectorAll('#mocDs .mt2');if(o.length) o[o.length-1].focus()}
  else if(a==='xoamoc'){docSua();SUA.moc.splice(+t.dataset.i,1);veSua(SUA._moi)}
  else if(a==='luusua') luuSua(false);
  else if(a==='xongsua'){if(SUA&&SUA.loai==='quyet'){const i=SUA.id;luuSua(false);if(M[i]) moQuyet(i)}else luuSua(true)}
  else if(a==='xoasua'){if(SUA) xoaMuc(SUA.id)}
  else if(a==='anTS'){dat('cn_an_ts',lay('cn_an_ts','1')==='1'?'0':'1');ve()}
  else if(a==='agduyet'||a==='agxemlai'){
    const x=D.choDuyet.find(y=>y.id===id);if(!x) return;
    let gc='';if(a==='agxemlai'){gc=prompt('Chị muốn xem lại thế nào? (ghi ngắn, có thể để trống)','');if(gc===null) return}
    D.choDuyet=D.choDuyet.filter(y=>y.id!==id);ve();day1({f:'ag',id,qd:a==='agduyet'?'duyet':'xemlai',ghiChu:gc});bao(a==='agduyet'?'✓ Đã duyệt, trợ lý sẽ làm ở lượt kế tiếp':'Đã gửi trợ lý xem lại');
  }
});
$('fab').onclick=()=>{const l=MAC_LOAI[TAB]||'viec';moSua(null,{loai:l,nhom:TAB==='gia-dinh'?'gd':TAB==='hoc'?'hoc':'lanest',ngay:l==='bc'?HN():TAB==='lich'&&NGAY_CHON?NGAY_CHON:''})};
$('nTim').onclick=moTim;
$('nLai').onclick=()=>{TS=null;napLai().then(()=>bao('✓ Đã tải lại'))};
$('nNen').onclick=()=>{const toi=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=toi?'light':'dark';dat('cn_nen',document.documentElement.dataset.theme)};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape') dong()});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(MUC.some(m=>m[0]===t)&&t!==TAB){TAB=t;ve()}});
window.addEventListener('beforeunload',ev=>{if(HANG.length){ev.preventDefault();ev.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&DA_NAP&&Date.now()-LUC_NAP>60000) napLai()});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});

}
