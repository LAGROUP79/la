<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
<link rel="stylesheet" href="https://lagroup79.github.io/kho-lanest/ln-style.css">
<style>
:root{--xanh:#1B4D40;--xanh2:#2C6B5A;--kem:#F7F2E3;--vang:#C9A24A;--vangnhat:#FCE9A6;--vien:#E3D6AE;--chu:#24302C;--nhat:#5B6B64;--do:#B3261E;--xanhla:#2E7D32;--cam:#B26A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--kem);color:var(--chu);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.an{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--xanh);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header .ten{flex:1;min-width:0}
header .ten b{display:block;font-size:15px;letter-spacing:.3px}
header .ten small{opacity:.85;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:860px;margin:0 auto;padding:12px 12px 90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--vien);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11.5px;color:var(--nhat);position:relative}
nav button b{display:block;font-size:18px;line-height:1.15}
nav button.on{color:var(--xanh);font-weight:600}
nav button.on::after{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--vang);border-radius:0 0 3px 3px}
.dem{position:absolute;top:3px;right:calc(50% - 24px);background:var(--do);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:600}
.the{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.the h3{margin:0 0 8px;font-size:15px;color:var(--xanh)}
.the h4{margin:12px 0 6px;font-size:14px;color:var(--xanh)}
h2.tieude{font-size:17px;color:var(--xanh);margin:4px 2px 10px}
label{display:block;font-size:13px;color:var(--nhat);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid #CFC3A0;border-radius:9px;padding:9px 10px;background:#fff;min-height:40px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--vang);outline-offset:0;border-color:var(--vang)}
input:disabled{background:#F4F0E4;color:var(--nhat)}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:10px 14px;background:var(--xanh);color:#fff;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;text-align:center}
.nut.phu{background:#fff;color:var(--xanh);border:1px solid var(--xanh)}
.nut.vang{background:var(--vang);color:#1d1a10}
.nut.do{background:#fff;color:var(--do);border:1px solid var(--do)}
.nut.nho{padding:6px 10px;min-height:32px;font-size:13px}
.nut.rong{width:100%}
.nut:disabled{opacity:.5}
.hang{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hang>*{flex:1;min-width:0}
.luoi2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--nhat);font-size:13px}
.chip{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;background:#EEE;white-space:nowrap}
.chip.cho{background:#FFF1D6;color:var(--cam)}.chip.gui{background:#E1EEFA;color:#1F5A8C}.chip.giao,.chip.xong{background:#E3F2E5;color:var(--xanhla)}.chip.huy,.chip.tre{background:#F8E1DF;color:var(--do)}
.oclon{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
@media(min-width:620px){.oclon{grid-template-columns:repeat(4,1fr)}}
.oclon button{position:relative;overflow:hidden;background:var(--nen);border:1px solid rgba(0,0,0,.04);border-radius:18px;padding:14px 12px 12px;text-align:left;min-height:132px;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:0 6px 16px rgba(27,77,64,.08);transition:transform .12s,box-shadow .12s}
.oclon button::after{content:'';position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;background:var(--dam);opacity:.10}
.oclon button:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(27,77,64,.14)}
.oclon button:active{transform:scale(.97)}
.oclon .ico{width:40px;height:40px;border-radius:12px;background:var(--dam);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:6px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.oclon .ico svg{width:22px;height:22px}
.oclon button b{font-size:14px;color:var(--dam2);letter-spacing:.3px}
.oclon button span{font-size:12px;color:#4E5B56;line-height:1.35}
.oclon button i{font-style:normal;font-size:13px;font-weight:700;color:var(--dam2);background:rgba(255,255,255,.75);border-radius:20px;padding:3px 9px;align-self:flex-start;margin-top:auto}
.oclon button.noibat{border:2px solid var(--dam)}
.oclon button.khoa{filter:grayscale(.75);opacity:.6}
h3.nhom{font-size:13px;letter-spacing:1.5px;color:var(--nhat);margin:6px 2px 8px}
.chao{background:linear-gradient(135deg,#1B4D40 0%,#2C6B5A 60%,#3F7F5F 100%);color:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(27,77,64,.22)}
.chao::after{content:'';position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:#C9A24A;opacity:.18}
.chao small{color:#CFE3DA;font-size:12px}
.chao b{font-size:18px}
.chao .vang{color:#F3D58A}
.chao .thanh{background:rgba(255,255,255,.2)}
.chao .thanh i{background:#F3D58A}
.chao .phong{margin-top:12px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;position:relative;z-index:1}
.chao .luoi2{position:relative;z-index:1}
.sp{border:1px dashed var(--vien);border-radius:10px;padding:8px;margin-bottom:8px;background:#FFFDF6}
.sp .dong1{display:grid;grid-template-columns:118px 1fr 36px;gap:6px}
.sp .dong2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sp .tt{font-size:13px;color:var(--nhat);margin-top:4px;text-align:right}
.sp .info{font-size:12.5px;color:var(--xanh);margin-top:4px}
.sp .info.canh{color:var(--do)}
.x{border:0;background:#F8E1DF;color:var(--do);border-radius:8px;font-size:18px;min-height:40px}
.tong{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;color:var(--xanh);padding:10px 0 2px}
.don{border:1px solid var(--vien);border-radius:12px;background:#fff;padding:10px 12px;margin-bottom:10px}
.don .dau{display:flex;gap:8px;align-items:center;justify-content:space-between}
.don .ma{font-weight:700;color:var(--xanh)}
.don .kh{margin:4px 0;font-weight:600}
.don .nut{margin-top:6px}
.don .hang>*{flex:0 0 auto}
pre{white-space:pre-wrap;word-break:break-word;background:#FFFDF6;border:1px solid var(--vien);border-radius:10px;padding:10px;font-family:inherit;font-size:14px;margin:8px 0;max-height:55vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 6px;border-bottom:1px solid #EFE6CC;text-align:left;vertical-align:top}
th{color:var(--nhat);font-weight:600;background:#FBF7EA}
td.s,th.s{text-align:right;white-space:nowrap}
.cuon{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
tr.hn td{background:#FFF6DA;font-weight:600}
tr.qua td{color:var(--nhat)}
tr.cong td{font-weight:700;background:#FBF7EA}
.o{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.o>div{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:10px}
.o small{display:block;color:var(--nhat);font-size:12px}
.o b{font-size:17px;color:var(--xanh)}
.thanh{height:8px;background:#EFE6CC;border-radius:6px;overflow:hidden;margin-top:6px}
.thanh i{display:block;height:100%;background:var(--vang)}
.thanh i.du{background:var(--xanhla)}
.moi{position:fixed;inset:0;background:rgba(20,30,26,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.moi .hop{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.moi{align-items:center}.moi .hop{border-radius:16px}}
.bao{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--chu);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:92vw;font-size:14px}
.bao.loi{background:var(--do)}
.phudang{position:fixed;inset:0;background:rgba(247,242,227,.6);z-index:40;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--xanh)}
#dangNhap{padding-bottom:16px}
#dangNhap .ln-title{font-size:34px}
#dangNhap .ln-field select,#dangNhap .ln-field input{min-height:0;border:0;border-radius:0;padding:13px 0;width:auto;outline:none}
#dangNhap .ln-field select:focus,#dangNhap .ln-field input:focus{outline:none}
#dangNhap .ln-form label{margin:0}
#dangNhap .ln-badge{display:inline-flex;align-items:center;gap:6px;background:#FFF6DA;border:1px solid #E9D49A;color:#7A5A12;border-radius:20px;padding:4px 12px;font-size:12.5px;font-weight:600;letter-spacing:.4px;margin:0 0 12px}
#dangNhap .ln-badge svg{width:15px;height:15px}
#dangNhap .ic svg{width:55%;height:55%}
.tab2{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
.tab2 button{border:1px solid var(--vien);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.tab2 button.on{background:var(--xanh);color:#fff;border-color:var(--xanh)}
.goiy{background:#E9F3EE;border-radius:8px;padding:6px 10px;font-size:13px;margin-top:6px;color:var(--xanh)}
.goiy.canh{background:#F8E1DF;color:var(--do)}
details{border-top:1px solid #EFE6CC;padding:4px 0}
details summary{cursor:pointer;color:var(--xanh);font-weight:600;padding:6px 0}
.anh{max-width:100%;border-radius:10px;margin-top:8px}
.lich{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;text-align:center}
.lich div{background:#FBF7EA;border-radius:6px;padding:4px 2px;min-height:44px}
.lich div b{display:block;font-size:13px}
.lich .t1{background:#E3F2E5}.lich .tT{background:#FFF1D6}.lich .tV,.lich .tĐX{background:#F8E1DF}.lich .tP{background:#E1EEFA}.lich .tOFF{background:#F1F1F1;color:#999}
.quaylai{border:0;background:none;color:var(--xanh);font-weight:600;padding:4px 0 8px;cursor:pointer}
.lienket{border:0;background:none;color:var(--xanh);font-weight:600;padding:0;text-align:left;cursor:pointer}
.chandung{width:84px;height:104px;border-radius:12px;background:#FBF7EA;border:1px solid var(--vien);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--nhat);text-align:center;overflow:hidden}
.chandung img{width:100%;height:100%;object-fit:cover}
.dongnv{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #EFE6CC;padding:9px 2px;cursor:pointer}
.dongnv b{color:var(--xanh)}
.chon{display:flex!important;gap:8px;align-items:center;color:var(--chu)!important}
.chon input{width:auto;min-height:0}
.khdong{display:grid;grid-template-columns:1fr 96px;gap:4px 8px;align-items:center;padding:8px 0;border-bottom:1px solid #EFE6CC}
.khdong.ba{grid-template-columns:1fr 84px 112px}
.khdong b{color:var(--xanh);font-size:14px}
.khdong input{min-height:38px;padding:7px 8px;text-align:right}
.khdong .le{grid-column:1/-1;font-size:12px;color:var(--nhat);min-height:0}
.khdong .le.lech{color:var(--do);font-weight:600}
.khphan{font-size:12px;letter-spacing:1px;color:var(--nhat);margin:12px 0 0;font-weight:600}
.khday{position:sticky;bottom:64px;z-index:3;background:#fff;border:1px solid var(--vien);border-radius:14px;padding:10px 12px;box-shadow:0 -4px 16px rgba(27,77,64,.10);margin-top:10px}
td.am{color:var(--do);font-weight:700}
.navPhong{display:none}
@media(min-width:760px) and (max-width:1023px){main{max-width:980px;padding:16px 24px 96px}.oclon{grid-template-columns:repeat(3,1fr)}.oclon.nam{grid-template-columns:repeat(3,1fr)}}
/* ===== Laptop / màn hình rộng: menu bên trái, nội dung rộng, lưới cân đối ===== */
@media(min-width:1024px){
  body{background:#F3EEDD}
  header{padding:12px 28px;height:58px;box-shadow:0 2px 10px rgba(27,77,64,.15)}
  header .ten{display:flex;align-items:baseline;gap:14px}
  header .ten b{font-size:19px;letter-spacing:2px}
  header .ten small{font-size:13px}
  nav{top:58px;bottom:0;left:0;right:auto;width:240px;flex-direction:column;border-top:0;border-right:1px solid var(--vien);padding:18px 12px 24px;gap:2px;overflow-y:auto;background:#FFFDF6}
  nav button{flex:0 0 auto;display:flex;align-items:center;gap:12px;text-align:left;font-size:14.5px;padding:11px 14px;border-radius:12px;color:var(--chu);cursor:pointer}
  nav button:hover{background:#F3EEDD}
  nav button b{display:inline-flex;width:22px;justify-content:center;font-size:17px;color:var(--xanh)}
  nav button.on{background:#E3F2EA;color:var(--xanh);font-weight:600}
  nav button.on::after{display:none}
  nav .dem{position:static;margin-left:auto;font-size:11px;padding:2px 7px}
  .navPhong{display:block;margin-top:18px;padding-top:14px;border-top:1px solid var(--vien)}
  .navPhong small{display:block;font-size:11.5px;letter-spacing:1.5px;color:var(--nhat);font-weight:600;margin:0 14px 8px}
  .navPhong button{width:100%;font-size:13.5px}
  .navPhong button i{width:10px;height:10px;border-radius:50%;background:var(--dam);flex:0 0 10px;margin:0 6px 0 6px}
  .navPhong button.khoa{opacity:.55}
  main{max-width:1240px;margin:0 0 0 240px;padding:26px 40px 48px}
  h2.tieude{font-size:22px;margin:4px 2px 16px}
  .chao{padding:24px 28px;border-radius:22px}
  .chao b{font-size:24px}
  .chao .luoi2{grid-template-columns:2fr 1fr}
  .oclon{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-bottom:20px}
  .oclon.bon{grid-template-columns:repeat(4,1fr)}
  .oclon.nam{grid-template-columns:repeat(5,1fr)}
  .oclon button{min-height:160px;padding:20px 18px 16px;border-radius:20px}
  .oclon .ico{width:46px;height:46px;border-radius:14px}
  .oclon .ico svg{width:25px;height:25px}
  .oclon button b{font-size:15px}
  .oclon button span{font-size:13px}
  h3.nhom{font-size:13.5px;margin:10px 2px 12px}
  .phongLuoi{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
  .phongLuoi>.the{position:sticky;top:82px;margin:0}
  .phongLuoi .oclon{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .the{padding:18px 22px;border-radius:16px;margin-bottom:16px}
  .the h3{font-size:16px}
  .o{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .o b{font-size:20px}
  table{font-size:14px}
  th,td{padding:8px 10px}
  .khds{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  .khds .khphan{grid-column:1/-1}
  .khday{bottom:18px;max-width:760px;margin-left:auto}
  .moi{align-items:center}
  .moi .hop{max-width:640px;border-radius:18px;padding:22px 26px}
  .bao{bottom:28px}
  .don{padding:12px 16px}
  .tab2 button{font-size:14px;padding:8px 16px}
}
@media(min-width:1440px){main{padding:30px 56px 56px}.oclon{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
</style>
</head>
<body>
<div id="dangNhap">
  <div class="ln">
    <img class="ln-hero" src="https://lagroup79.github.io/kho-lanest/hero.jpg" alt="Công ty TNHH Yến Sào Lanest — Trao sức khoẻ, Trao yêu thương">
    <form class="ln-card" id="dnForm" autocomplete="off">
      <h1 class="ln-title">ĐĂNG NHẬP</h1>
      <div id="dnDiv"></div>
      <div class="ln-badge"><i data-ic="kd"></i>LAGROUP</div>
      <p class="ln-sub">Hệ thống quản lý Yến Sào Lanest</p>
      <div class="ln-form">
        <div class="ln-err an" id="dnLoi"></div>
        <label>Tên nhân viên<span class="ln-field"><i data-ic="user"></i><select id="dnTen" required><option value="">Đang tải…</option></select></span></label>
        <label>Mã truy cập<span class="ln-field"><i data-ic="lock"></i><input id="dnMa" type="password" inputmode="numeric" autocomplete="off" placeholder="Nhập mật mã" required></span></label>
        <button class="ln-btn pri" type="submit" id="dnNut"><span>Đăng nhập</span><i data-ic="arrow"></i></button>      </div>
    </form>
    <div id="dnBrand"></div>
  </div>
</div>

<div id="app" class="an">
  <header>
    <div class="ten"><b>LAGROUP</b><small id="hdTen"></small></div>
    <button id="nutThoat">Thoát</button>
  </header>
  <main id="noiDung"></main>
  <nav id="thanhNav"></nav>
</div>
<div id="lop"></div>

<script src="https://lagroup79.github.io/kho-lanest/ln-parts.js"></script>
<script>
var TK = '', H = null, TAB = 'home', SUA = null, LOC = {}, DS_DON = [], BC = null, BC_THANG = '', BC_XEM = 'tong', DS_KH = null;
var NG = { HU: 'Hàng hũ', TT: 'Hàng tinh thô' };
var TTD = { 'Chờ soạn': 'cho', 'Đã gửi soạn': 'gui', 'Đã giao': 'giao', 'Đã huỷ': 'huy', 'Hoàn thành': 'xong', 'Chờ duyệt': 'gui', 'Trả lại': 'tre' };

function $(id) { return document.getElementById(id); }

    b.theoNhom.map(function (x) { var ln = x.tienCoVon - x.von; return '<tr><td>' + e(x.nhom) + '</td><td class="s">' + tien(x.tien) + '</td><td class="s">' + tien(x.von) + '</td><td class="s">' + mau(ln) + '</td><td class="s">' + pt(ln, x.tienCoVon) + '</td><td class="s">' + (x.chuaVon ? '<span class="am">' + tien(x.chuaVon) + '</span>' : '') + '</td></tr>'; }).join('') + '</table></div></div>';
  var khoSP = (SB.sp || []).filter(function (s) { return s.kho; }), khoTen = {}; khoSP.forEach(function (s) { khoTen[s.ten.toLowerCase()] = 1; });
  h += '<datalist id="dsKhoSB">' + khoSP.map(function (s) { return '<option value="' + e(s.ten) + '">'; }).join('') + '</datalist>';
  h += '<div class="the"><h3 style="margin-top:0">Theo sản phẩm</h3><input id="bcTimSP" placeholder="Tìm sản phẩm…" style="margin-bottom:6px"><div class="cuon"><table><tr><th>Sản phẩm</th><th class="s">SL</th><th class="s">Doanh thu</th><th class="s">Giá vốn / đv</th><th class="s">LN gộp</th></tr>' +
    b.theoSP.map(function (x, i) {
      var gv = x.coVon ? tien(x.gia) + '<br><small class="muted">' + e(x.nguon) + '</small>' : '<span class="am">chưa có</span>';
      if (b.ghi && x.nhom !== 'Dịch vụ') gv += '<br><input data-gvsp="' + i + '" inputmode="numeric" placeholder="' + (x.coVon ? 'đổi giá' : 'nhập giá vốn') + '" style="width:100px;padding:2px 5px;font-size:12px;margin-top:2px">';
      var ghep = b.ghi && (x.nhom === 'YẾN TINH' || x.nhom === 'YẾN THÔ') && !khoTen[x.sp.toLowerCase()] ? '<br><input data-ghepsp="' + i + '" list="dsKhoSB" placeholder="ghép vào mã kho…" style="width:170px;padding:2px 5px;font-size:12px;margin-top:2px">' : '';
      return '<tr data-timsp="' + e((x.sp + ' ' + x.nhom).toLowerCase()) + '"><td>' + e(x.sp) + '<br><small class="muted">' + e(x.nhom || '') + '</small>' + ghep + '</td><td class="s">' + soSL(x.sl) + '</td><td class="s">' + tien(x.tien) + '</td><td class="s">' + gv + '</td><td class="s">' + (x.coVon ? mau(x.tien - x.von) : '—') + '</td></tr>';
    }).join('') + '</table></div>' + (b.ghi ? '<p class="muted" style="margin-bottom:0">Gõ giá vốn (đồng / 1 đơn vị bán, VD tinh tính theo 100g) rồi bấm Enter — áp cho mọi đơn của sản phẩm đó, báo cáo tính lại ngay.</p>' : '') + '</div>';
  h += '<div class="the"><h3 style="margin-top:0">Theo ngày</h3><div class="cuon"><table><tr><th>Ngày</th><th class="s">Số đơn</th><th class="s">Doanh thu</th><th class="s">LN gộp</th><th class="s">Thu tiền</th></tr>' +
    b.theoNgay.map(function (x) { return '<tr><td>' + ngayDu(x.ngay) + '</td><td class="s">' + x.don + '</td><td class="s">' + tien(x.tien) + '</td><td class="s">' + mau(x.ln) + '</td><td class="s">' + tien(x.thu) + '</td></tr>'; }).join('') + '</table></div></div>';
  h += '<div class="the"><h3 style="margin-top:0">Top khách</h3><div class="cuon"><table><tr><th>Khách</th><th class="s">Số đơn</th><th class="s">Doanh thu</th><th class="s">LN gộp</th></tr>' +
    b.theoKhach.map(function (k) { return '<tr><td>' + e(k.ten) + '</td><td class="s">' + k.don + '</td><td class="s">' + tien(k.tien) + '</td><td class="s">' + mau(k.ln) + '</td></tr>'; }).join('') + '</table></div></div>';
  h += '<div class="the"><h3 style="margin-top:0">Tiền thu theo hình thức</h3><table>' + b.theoHT.map(function (x) { return '<tr><td>' + e(x.ht) + '</td><td class="s">' + tien(x.tien) + 'đ</td></tr>'; }).join('') + '</table>' +
    '<p class="muted" style="margin-bottom:0">Cần file Excel chi tiết: Phòng Tài chính Kế toán → Tải Excel.</p></div>';
  $('bcNoi').innerHTML = h;
  $('bcTimSP').oninput = function () { var q = this.value.toLowerCase().trim(); document.querySelectorAll('[data-timsp]').forEach(function (tr) { tr.classList.toggle('an', !!q && tr.dataset.timsp.indexOf(q) < 0); }); };
  document.querySelectorAll('[data-gvsp]').forEach(function (el) {
    el.onkeydown = function (ev) {
      if (ev.key !== 'Enter') return;
      var x = b.theoSP[+el.dataset.gvsp], g = docTien(el.value);
      if (!g && !confirm('Bỏ giá vốn đặt riêng của "' + x.sp + '"?')) return;
      goi('ktLuuGiaVon', [TK, x.sp, g, SB_BC.tu, SB_BC.den], function (r) { SB_BC.r = r; sbVeBCNoi(); bao('Đã đặt giá vốn ' + x.sp + (g ? ': ' + tien(g) + 'đ' : '') + '.'); });
    };
  });
  document.querySelectorAll('[data-ghepsp]').forEach(function (el) {
    el.onchange = function () {
      var x = b.theoSP[+el.dataset.ghepsp], moi = el.value.trim();
      if (!khoTen[moi.toLowerCase()]) { if (moi) bao('Chọn đúng tên trong danh sách mã kho.', true); return; }
      if (!confirm('Đổi mọi dòng "' + x.sp + '" trong Sổ bán hàng (từ 01/10) thành mã kho "' + moi + '"?')) { el.value = ''; return; }
      goi('ktGhepTen', [TK, x.sp, moi, SB_BC.tu, SB_BC.den], function (r) { SB_BC.r = r; sbVeBCNoi(); bao('Đã ghép "' + x.sp + '" vào "' + moi + '".'); });
    };
  });
}
function veXl() {
  $('noiDung').innerHTML = quayLai() + '<div class="the"><h3>Tải dữ liệu ra Excel</h3><p class="muted">Một file Excel gồm các sổ: đơn hàng, chi tiết đơn, khách hàng, xuất kho kế toán, phiếu kho, tồn kho, danh mục hàng, chấm công, nghỉ phép, điều chỉnh công, lương, nhật ký điều chỉnh. Số liệu mới nhất lúc bấm tải. Không có mật mã, hồ sơ CCCD.</p>' +
    '<button class="nut rong" id="xlTai">Tải file Excel</button></div>';
  $('xlTai').onclick = function () {
    var nut = this; nut.disabled = true; nut.textContent = 'Đang lấy dữ liệu…';
    var xong = function () { nut.disabled = false; nut.textContent = 'Tải file Excel'; };
    napThuVienXl(function () {
      goi('ktTaiDuLieu', [TK], function (ds) {
        var wb = XLSX.utils.book_new();
        ds.forEach(function (s) {
          var rows = s.rows.map(function (r) { return r.map(function (v) { return /^-?\d+(\.\d+)?$/.test(v) && v.length < 15 ? Number(v) : v; }); });
          XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows.length ? rows : [['Chưa có dữ liệu']]), s.ten.slice(0, 31));
        });
        XLSX.writeFile(wb, 'LAGROUP-du-lieu-' + (H ? H.homNay : '') + '.xlsx');
        xong(); bao('Đã tải file Excel.');
      }, false, function (m) { xong(); bao(m, true); });
    }, function () { xong(); bao('Không tải được bộ tạo Excel. Kiểm tra mạng rồi thử lại.', true); });
  };
}
function napThuVienXl(ok, loi) {
  if (window.XLSX) return ok();
  var s = document.createElement('script');
  s.src = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = ok; s.onerror = loi; document.head.appendChild(s);
}
function bamKho(b) {
  var d = b.dataset;
  if (d.khcat) { KF.cat = d.khcat; KF.tim = ''; if (KF.type === 'xuat' && KF.reason === '') KF.reason = 'Bán hàng'; veKho(); return; }
  if (b.id === 'khGui') return guiKho();
  if (b.id === 'khChot') return chotKho();
  if (d.khhuy) { if (!confirm('Huỷ phiếu ' + d.khhuy + '? App ghi phiếu hoàn lại tồn như app Kho.')) return; goi('khoHuyPhieu', [TK, d.khhuy, KP.ngay], function (x) { veKp(x.kp); bao('Đã huỷ phiếu.'); }); return; }
}

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { chuyenTab(b.dataset.tab); return; }
  if (b.dataset.cc) { moChamCong(b.dataset.cc); return; }
  if (b.id === 'nutThoat') { if (confirm('Thoát khỏi app?')) thoat(); return; }
  if (b.id === 'fThem') { $('fSP').insertAdjacentHTML('beforeend', dongSP()); return; }
  if (b.id === 'fGui') { guiDon(); return; }
  if (b.id === 'fHuySua') { chuyenTab('ds'); return; }
  if (b.dataset.xoa) { var sp = b.closest('.sp'); if (document.querySelectorAll('#fSP .sp').length > 1) sp.remove(); else sp.outerHTML = dongSP(); tinhTong(); return; }
  if (b.dataset.bx) { BC_XEM = b.dataset.bx; if (BC) veBaoCao(BC); return; }
  if (b.dataset.cdx) { document.querySelectorAll('[data-cdx]').forEach(function (x) { x.classList.toggle('on', x === b); }); moCaiDat(b.dataset.cdx); return; }
  if (TAB === 'cv' && CV) bamCongViec(b);
  if (TAB === 'np' && NP) bamNghiPhep(b);
  if (TAB === 'ds') bamDon(b);
  if (TAB === 'kh' && DS_KH) bamKhach(b);
  if (TAB === 'crm' && CRM) bamCrm(b);
  if (/^(hs|ns_)/.test(TAB)) bamNS(b);
  if (/^k[knxpb]$/.test(TAB)) bamKho(b);
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.dataset.f === 'nganh') { var b = t.closest('.sp'); b.querySelector('[data-f=ma]').innerHTML = optSP(t.value, ''); b.querySelector('.khac').classList.add('an'); tinhTong(); }
  if (t.dataset.f === 'ma') {
    var b2 = t.closest('.sp'), p = H.sanPham.filter(function (x) { return x.ma === t.value; })[0], g = b2.querySelector('[data-f=gia]');
    b2.querySelector('.khac').classList.toggle('an', t.value !== 'KHAC');
    if (p && p.gia && !docTien(g.value)) g.value = tien(p.gia);
    tinhTong();
  }
  if (t.id === 'fCoHD') $('fHD').classList.toggle('an', !t.checked);
  if (t.id === 'khLyDo') { KF.reason = t.value; veKho(); }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.dataset.f === 'sl' || t.dataset.f === 'gia' || t.id === 'fGiam') tinhTong();
  if (t.id === 'fSdt') timKhach();
  if (t.dataset.khsl) { KF.draft[t.dataset.khsl] = t.value; lechKho(t.dataset.khsl); demKho(); }
  if (t.dataset.khgv) KF.cost[t.dataset.khgv] = t.value;
  if (t.dataset.khgb) { KF.price[t.dataset.khgb] = t.value; demKho(); }
  if (t.id === 'khGhiChu') KF.note = t.value;
  if (t.id === 'crmQ' && CRM) { CRM.q = t.value; CRM.hien = 60; veCrmDs(); }
  if (t.id === 'khTim') { KF.tim = t.value; var q = t.value.toLowerCase(); document.querySelectorAll('.khdong').forEach(function (d) { d.classList.toggle('an', d.dataset.ten.indexOf(q) < 0); }); }
});
document.addEventListener('focusout', function (ev) {
  var t = ev.target;
  if (t.dataset.f === 'gia' || t.dataset.k) { var n = docTien(t.value); t.value = n ? tien(n) : ''; }
});
$('dnForm').addEventListener('submit', dangNhap);
veDangNhap();

function luuH() { try { luu('kd_h', JSON.stringify(H)); } catch (x) {} }
(function batDau() {
  var tk = lay('kd_tk'), cu = null;
  try { cu = JSON.parse(lay('kd_h') || 'null'); } catch (x) {}
  if (!tk) { napTen(); return; }
  if (cu && cu.me) { TK = tk; vaoApp(cu); }
  google.script.run.withSuccessHandler(function (h) {
    TK = tk;
    if (!cu || !cu.me) { vaoApp(h); return; }
    H = h; luuH(); veNav(); if (TAB === 'home' && !PHONG_HT) veTab();
  }).withFailureHandler(function (err) {
    var m = (err && err.message) || String(err);
    if (cu && cu.me && m.indexOf('HET_PHIEN') < 0) { bao('Chưa lấy được số mới nhất — kiểm tra mạng rồi tải lại trang.', true); return; }
    luu('kd_tk', null); luu('kd_h', null); if (cu && cu.me) thoat(true); else napTen();
  }).trangChu(tk);
})();
